<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <style>
    .title { font: bold 18px sans-serif; }
    .phase { font: 14px sans-serif; }
    .bar { fill: #2b8cc4; }
    .milestone { fill: #e36f6f; }
    .label { font: 12px sans-serif; fill: #111; }
  </style>
  <rect width="100%" height="100%" fill="#fff" />
  <text x="20" y="28" class="title">Nexus Project - Phase Timeline (high level)</text>

  <!-- timeline scale: 2025 - 2027 mapped across width -->
  <text x="140" y="60" class="label">2025</text>
  <text x="420" y="60" class="label">2026</text>
  <text x="740" y="60" class="label">2027</text>

  <!-- Phase 1 bar -->
  <text x="20" y="100" class="phase">Phase 1 - Prototype and Integration</text>
  <rect x="140" y="110" width="220" height="24" class="bar" rx="4" />
  <text x="370" y="126" class="label">Q1-Q4 2025 (TRL 2->3)</text>

  <!-- Phase 2 bar -->
  <text x="20" y="160" class="phase">Phase 2 - Closed Pilots and Cert Prep</text>
  <rect x="340" y="170" width="260" height="24" class="bar" rx="4" />
  <text x="610" y="186" class="label">Q1-Q3 2026 (TRL 3->4-5)</text>

  <!-- Phase 3 bar -->
  <text x="20" y="220" class="phase">Phase 3 - Pilot Scale and Certification</text>
  <rect x="640" y="230" width="300" height="24" class="bar" rx="4" transform="translate(0,-40)" />
  <text x="760" y="206" class="label">Q1-Q4 2027 (TRL 5->6)</text>
</svg>
